name: Build and push API image

# Builds the API's container image and pushes it to GHCR. Flux, already running on the
# Pi5 cluster, watches ghcr.io/baiganio/contacts-api for new semver tags and rolls the
# Deployment itself (see Infrastructure/Kubernetes/Contacts/flux/image-automation.yaml) —
# this workflow never touches the cluster directly, no SSH key or kubeconfig needed here.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pi5 is ARM64 only; no amd64 build needed.
          platforms: linux/arm64
          push: true
          tags: ghcr.io/baiganio/contacts-api:${{ steps.version.outputs.version }}
