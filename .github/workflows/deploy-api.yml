name: Build and push API image

# Builds the API's container image and pushes it to GHCR on every push to master that
# touches the API. Flux, already running on the Pi5 cluster, watches
# ghcr.io/baiganio/contacts-api for the highest build number and rolls the Deployment
# itself (see Infrastructure/Kubernetes/Contacts/flux/image-automation.yaml) — this
# workflow never touches the cluster directly, no SSH key or kubeconfig needed here.
on:
  push:
    branches: [master]
    paths: ["src/**", "Dockerfile", ".dockerignore", "Contacts.slnx"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pi5 is ARM64 only; no amd64 build needed.
          platforms: linux/arm64
          push: true
          # github.run_number always goes up, one per workflow run, so Flux's numerical
          # ImagePolicy can always tell which build is newest without a hand-made git tag.
          tags: ghcr.io/baiganio/contacts-api:${{ github.run_number }}
