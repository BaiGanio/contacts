name: Verify

# Reusable: builds the API and Angular app, runs the backend test suite, and runs the
# 3 Playwright e2e scenarios against a temporary PostgreSQL service. Called by
# pr-checks.yml (every pull request) and contacts.yml (every push to master, as the
# gate deploys wait on) — never triggered directly, so there is exactly one place
# that defines what "verified" means.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contacts_e2e
          POSTGRES_USER: lk_contacts
          POSTGRES_PASSWORD: lk_contacts
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build backend
        run: dotnet build Contacts.slnx

      - name: Run backend tests
        run: dotnet test Contacts.slnx

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/Contacts.E2E/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install e2e test dependencies
        working-directory: tests/Contacts.E2E
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/Contacts.E2E
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: tests/Contacts.E2E
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/Contacts.E2E/playwright-report/
            tests/Contacts.E2E/test-results/
          retention-days: 7
