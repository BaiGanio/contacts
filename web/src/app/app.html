<main class="content">
  <header class="page-heading">
    <h1>Contacts</h1>
    <button mat-flat-button type="button" (click)="openCreateDialog()">Add contact</button>
  </header>

  <p class="count">{{ contactCount() }} contacts</p>

  <div class="table-scroll">
    <table mat-table [dataSource]="contacts()">
      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef>Contact</th>
        <td mat-cell *matCellDef="let contact"><strong>{{ contact.firstName }} {{ contact.surname }}</strong></td>
      </ng-container>
      <ng-container matColumnDef="dateOfBirth">
        <th mat-header-cell *matHeaderCellDef>Date of birth</th>
        <td mat-cell *matCellDef="let contact">{{ contact.dateOfBirth | date: 'dd MMM yyyy' }}</td>
      </ng-container>
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Address</th>
        <td mat-cell *matCellDef="let contact">{{ contact.address }}</td>
      </ng-container>
      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let contact">{{ contact.phoneNumber }}</td>
      </ng-container>
      <ng-container matColumnDef="iban">
        <th mat-header-cell *matHeaderCellDef>IBAN</th>
        <td mat-cell *matCellDef="let contact"><code>{{ contact.iban }}</code></td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</main>
